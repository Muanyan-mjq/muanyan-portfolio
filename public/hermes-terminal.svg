<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace">
  <!-- Terminal background -->
  <rect width="720" height="320" rx="10" fill="#0d1117"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="720" height="32" rx="10" fill="#161b22"/>
  <rect x="0" y="16" width="720" height="16" fill="#161b22"/>
  <circle cx="16" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="36" cy="16" r="6" fill="#febc2e"/>
  <circle cx="56" cy="16" r="6" fill="#28c840"/>
  <text x="360" y="20" text-anchor="middle" fill="#8b949e" font-size="11">Terminal — hermes gateway --dev</text>

  <!-- Commands -->
  <text x="20" y="60" fill="#58a6ff" font-size="13" font-weight="bold">$</text>
  <text x="36" y="60" fill="#e6edf3" font-size="13">hermes gateway --dev</text>

  <!-- Output lines -->
  <text x="20" y="86" fill="#7ee787" font-size="12">✓</text>
  <text x="36" y="86" fill="#c9d1d9" font-size="12">Loading configuration from config.yaml...</text>
  <text x="20" y="108" fill="#7ee787" font-size="12">✓</text>
  <text x="36" y="108" fill="#c9d1d9" font-size="12">LLM backend: DeepSeek (deepseek-chat)</text>
  <text x="20" y="130" fill="#7ee787" font-size="12">✓</text>
  <text x="36" y="130" fill="#c9d1d9" font-size="12">Gateway started on ws://0.0.0.0:8777</text>

  <text x="20" y="160" fill="#d2a8ff" font-size="12">→</text>
  <text x="36" y="160" fill="#c9d1d9" font-size="12">QQ adapter initializing...</text>
  <text x="20" y="182" fill="#7ee787" font-size="12">✓</text>
  <text x="36" y="182" fill="#c9d1d9" font-size="12">QQ adapter connected (BotAppID: 102xxxxxx)</text>

  <text x="20" y="212" fill="#d2a8ff" font-size="12">→</text>
  <text x="36" y="212" fill="#c9d1d9" font-size="12">WeChat adapter initializing...</text>
  <text x="20" y="234" fill="#7ee787" font-size="12">✓</text>
  <text x="36" y="234" fill="#c9d1d9" font-size="12">WeChat adapter connected (iLink)</text>

  <text x="20" y="264" fill="#8b949e" font-size="12">─────────────────────────────────────────────</text>
  <text x="36" y="284" fill="#7ee787" font-size="12" font-weight="bold">✓ All platforms ready. Waiting for messages...</text>

  <!-- Blinking cursor -->
  <text x="20" y="306" fill="#58a6ff" font-size="13" font-weight="bold">$</text>
  <rect x="36" y="296" width="8" height="14" fill="#e6edf3">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
