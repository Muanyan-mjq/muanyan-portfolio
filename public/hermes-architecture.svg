<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000030"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="16" fill="#0f172a"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">Hermes Agent 核心架构</text>

  <!-- Layer 1: Gateway -->
  <rect x="40" y="56" width="720" height="90" rx="10" fill="url(#g1)" filter="url(#shadow)" opacity="0.95"/>
  <text x="60" y="82" fill="#e0e7ff" font-size="13" font-weight="700">Gateway 网关层 — 统一消息出入口</text>
  <text x="60" y="102" fill="#c7d2fe" font-size="12">所有平台的消息汇聚到这里，再分发到后端 AI 处理</text>
  <!-- Platform icons -->
  <rect x="60" y="112" width="58" height="24" rx="6" fill="#ffffff20"/>
  <text x="89" y="129" text-anchor="middle" fill="#e0e7ff" font-size="11">🐧 QQ</text>
  <rect x="126" y="112" width="58" height="24" rx="6" fill="#ffffff20"/>
  <text x="155" y="129" text-anchor="middle" fill="#e0e7ff" font-size="11">💬 微信</text>
  <rect x="192" y="112" width="68" height="24" rx="6" fill="#ffffff20"/>
  <text x="226" y="129" text-anchor="middle" fill="#e0e7ff" font-size="11">📱 Telegram</text>
  <rect x="268" y="112" width="68" height="24" rx="6" fill="#ffffff20"/>
  <text x="302" y="129" text-anchor="middle" fill="#e0e7ff" font-size="11">💻 Discord</text>
  <rect x="344" y="112" width="58" height="24" rx="6" fill="#ffffff20"/>
  <text x="373" y="129" text-anchor="middle" fill="#e0e7ff" font-size="11">📧 邮件</text>
  <text x="720" y="129" text-anchor="end" fill="#a5b4fc" font-size="11">20+ 平台</text>

  <!-- Arrow 1→2 -->
  <line x1="400" y1="146" x2="400" y2="170" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="394,168 400,178 406,168" fill="#6366f1"/>

  <!-- Layer 2: Platform Adapters -->
  <rect x="40" y="178" width="720" height="70" rx="10" fill="url(#g2)" filter="url(#shadow)" opacity="0.95"/>
  <text x="60" y="204" fill="#dbeafe" font-size="13" font-weight="700">Platform Adapters 平台适配层 — 消息格式「翻译官」</text>
  <text x="60" y="224" fill="#bfdbfe" font-size="12">QQ WebSocket → 统一格式 ← 微信 iLink API → 统一格式 ← Telegram Bot API → 统一格式</text>
  <text x="720" y="238" text-anchor="end" fill="#93c5fd" font-size="11">所有平台消息转成统一内部格式</text>

  <!-- Arrow 2→3 -->
  <line x1="400" y1="248" x2="400" y2="272" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="394,270 400,280 406,270" fill="#2563eb"/>

  <!-- Layer 3: Agent Core -->
  <rect x="40" y="280" width="720" height="70" rx="10" fill="url(#g3)" filter="url(#shadow)" opacity="0.95"/>
  <text x="60" y="306" fill="#cffafe" font-size="13" font-weight="700">Agent Core 智能体核心 — 大脑 + 技能系统</text>
  <text x="60" y="326" fill="#a5f3fc" font-size="12">接入 LLM（DeepSeek/Claude/GPT）→ 理解意图 → 调用工具/技能 → 生成回复</text>
  <text x="720" y="340" text-anchor="end" fill="#67e8f9" font-size="11">LLM 后端自由切换</text>

  <!-- Arrow 3→4 -->
  <line x1="400" y1="350" x2="400" y2="374" stroke="#0891b2" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="394,372 400,382 406,372" fill="#0891b2"/>

  <!-- Layer 4: Skills & Tools -->
  <rect x="40" y="382" width="350" height="60" rx="10" fill="url(#g4)" filter="url(#shadow)" opacity="0.95"/>
  <text x="60" y="408" fill="#d1fae5" font-size="13" font-weight="700">🧩 Skills 技能系统</text>
  <text x="60" y="428" fill="#a7f3d0" font-size="12">OCR 识别 · 查天气 · 翻译 · 跑脚本 · 定时任务</text>

  <rect x="410" y="382" width="350" height="60" rx="10" fill="url(#g4)" filter="url(#shadow)" opacity="0.95"/>
  <text x="430" y="408" fill="#d1fae5" font-size="13" font-weight="700">🗄️ Memory 记忆系统</text>
  <text x="430" y="428" fill="#a7f3d0" font-size="12">SQLite 持久化 · 跨会话记忆 · 知识蒸馏</text>

  <!-- Footer note -->
  <text x="400" y="505" text-anchor="middle" fill="#64748b" font-size="11">DeepSeek / Claude / GPT 等 200+ 模型自由切换 · MIT 开源 · 数据完全本地</text>
</svg>
