<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="vaeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>
  <!-- 两个交织的箭头，代表编码-解码过程 -->
  <path d="M25 75 C25 75 25 25 50 25 C75 25 75 75 75 75"
        fill="none" stroke="url(#vaeGradient)" stroke-width="8" stroke-linecap="round"/>
  <path d="M75 25 C75 25 75 75 50 75 C25 75 25 25 25 25"
        fill="none" stroke="url(#vaeGradient)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <!-- 中间的点，代表潜在空间 -->
  <circle cx="50" cy="50" r="8" fill="url(#vaeGradient)"/>
  <!-- 箭头 -->
  <polygon points="75,75 70,60 80,60" fill="url(#vaeGradient)"/>
  <polygon points="25,25 20,40 30,40" fill="url(#vaeGradient)" opacity="0.6"/>
</svg>
