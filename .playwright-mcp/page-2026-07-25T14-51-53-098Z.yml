            - heading "What is VAE?" [level=2] [ref=f3e84]
            - paragraph [ref=f3e85]:
              - text: Imagine you have a bunch of handwritten digit images (MNIST dataset), and you want the machine to "learn" what digits look like, then generate new digit images on its own. This is the task of a
              - strong [ref=f3e86]: generative model
              - text: .
            - paragraph [ref=f3e87]: "VAE (Variational Autoencoder) is a type of generative model. Its core idea is simple:"
            - list [ref=f3e88]:
              - listitem [ref=f3e89]:
                - strong [ref=f3e90]: Encoder
                - text: ": \"Compresses\" an image into a small numerical vector (e.g., just 4 numbers)"
              - listitem [ref=f3e91]:
                - strong [ref=f3e92]: Decoder
                - text: ": \"Reconstructs\" the image from this small vector"
              - listitem [ref=f3e93]:
                - strong [ref=f3e94]: Latent Space
                - text: ": The space where these vectors live, where each point corresponds to an image"
            - paragraph [ref=f3e95]: If training is successful, we just need to sample a random vector from the latent space, feed it to the decoder, and generate a brand new image that looks like a real digit.
            - heading "Network Architecture" [level=2] [ref=f3e96]
            - paragraph [ref=f3e97]: "Let's look at the concrete implementation in code. The entire VAE consists of three parts:"
            - generic [ref=f3e98]:
              - paragraph [ref=f3e99]: Convolution Basics Review
              - paragraph [ref=f3e100]:
                - text: Before looking at the code, let's understand convolution. Convolution is 'scanning an image with a small window'. Suppose the image is a 5×5 pixel matrix and the kernel is a 3×3 matrix. The kernel slides from left to right, top to bottom like a flashlight. At each position, it
                - strong [ref=f3e101]: multiplies element-wise and sums
                - text: the covered 3×3 region with the kernel to get one pixel of the output.
              - paragraph [ref=f3e102]:
                - text: "Key parameters:"
                - code [ref=f3e103]: stride
                - text: controls how many steps the window moves each time, stride=2 halves the output size;
                - code [ref=f3e104]: padding
                - text: "adds a ring of 0s around the image, ensuring edge pixels can be scanned. Output size formula: floor((input_size + 2×padding - kernel_size) / stride) + 1."
              - paragraph [ref=f3e105]:
                - text: Convolution kernels are
                - strong [ref=f3e106]: independent learnable parameters
                - text: ", not fixed. Randomly generated before training, continuously adjusted through backpropagation during training, and fixed after training. Each kernel learns to detect different features — some find edges, some find textures, some find shapes."
            - heading "Encoder" [level=3] [ref=f3e107]
            - paragraph [ref=f3e108]: "The encoder's task is to compress a 28×28 grayscale image into two vectors: mean μ and log-variance log(σ²). Why two outputs? Because we need them to define a normal distribution."
            - generic [ref=f3e109]:
              - generic [ref=f3e110]:
                - generic [ref=f3e111]: python
                - button "Copy" [ref=f3e117]
              - generic [ref=f3e121]:
                - code [ref=f3e122]: "class Encoder(nn.Module): def __init__(self, latent_size): super(Encoder, self).__init__() self.conv1 = nn.Conv2d(1, 32, kernel_size=3, stride=2, padding=1) self.bn1 = nn.BatchNorm2d(32) self.conv2 = nn.Conv2d(32, 64, kernel_size=3, stride=2, padding=1) self.bn2 = nn.BatchNorm2d(64) # Output mean and variance self.fc_mu = nn.Linear(64*7*7, latent_size) self.fc_logvar = nn.Linear(64*7*7, latent_size) def forward(self, x): x = F.leaky_relu(self.bn1(self.conv1(x))) # 28×28 → 14×14 x = F.leaky_relu(self.bn2(self.conv2(x))) # 14×14 → 7×7 x = x.flatten(1) # Flatten to 3136 dims mu = self.fc_mu(x) # Output mean μ logvar = self.fc_logvar(x) # Output log-variance log(σ²) return mu, logvar"
                - button "Copy" [ref=f3e123]
            - paragraph [ref=f3e124]: "Two convolutional layers progressively reduce spatial dimensions:28×28 → 14×14 → 7×7while increasing channels: 1 → 32 → 64 (extracting more features)Finally, fully connected layers output two \\mu -dimensional vectors: μ and log(σ²)"
            - generic [ref=f3e125]:
              - paragraph [ref=f3e126]: "Line-by-line breakdown:"
              - list [ref=f3e127]:
                - listitem [ref=f3e128]:
                  - code [ref=f3e129]: Conv2d(1, 32, kernel_size=3, stride=2, padding=1)
                  - text: — Input 1 channel (grayscale), output 32 channels, stride=2 halves the size (28→14)
                - listitem [ref=f3e130]:
                  - code [ref=f3e131]: BatchNorm2d(32)
                  - text: — Stabilizes training, accelerates convergence, prevents gradient vanishing
                - listitem [ref=f3e132]:
                  - code [ref=f3e133]: LeakyReLU
                  - text: — Smoother than ReLU, avoids the "dying neuron" problem
                - listitem [ref=f3e134]:
                  - code [ref=f3e135]: fc_mu
                  - text: and
                  - code [ref=f3e136]: fc_logvar
                  - text: — Two separate FC layers outputting mean and log-variance respectively
                - listitem [ref=f3e137]: Why output log(σ²) instead of σ? Log can take any real value, more numerically stable
            - generic [ref=f3e138]:
              - paragraph [ref=f3e139]: "Deep Dive: Channels & Information Compression"
              - paragraph [ref=f3e140]: "What channels mean: channels = number of 'observation angles'. Shallow channels detect edges and textures; deep channels combine into curves and shapes. 1→32→64 is a 'doubling per layer' strategy — each time spatial dimensions halve (losing detail), channels double (increasing representation capacity). Using more 'angles' to compensate for the loss of 'resolution'."
              - paragraph [ref=f3e141]: Does halving stride lose information? Yes. 28→14 loses half the spatial resolution. But this is not a bug — it's the design purpose. The kernel learns to discard 'unimportant details' and concentrate 'meaningful features' into a smaller space.
              - paragraph [ref=f3e142]: "How to ensure discarded details are unimportant? The kernel is forced to learn. The encoder's situation: input 784 pixels, output only 4 numbers, with the rule that no matter how aggressively you compress, the Decoder must reconstruct. First attempt (random weights): random compression, Decoder reconstructs noise, huge loss. Backpropagation says: 'this pixel you discarded, Decoder needs it when reconstructing, increase related weights'; 'this pixel you kept, Decoder doesn't use it, decrease related weights'. After tens of thousands of iterations, it automatically converges to a strategy."
              - paragraph [ref=f3e143]:
                - text: How are FC layer weights generated? Randomly generated before training. Count = input positions × output positions.
                - code [ref=f3e144]: fc_mu = nn.Linear(3136, 4)
                - text: — PyTorch automatically creates a [3136, 4] matrix, each number randomly generated. 3136×4 = 12544 independent weights. During training, each batch triggers loss calculation, backpropagation, and individual fine-tuning of all 12544 weights.
            - heading "Decoder" [level=3] [ref=f3e145]
            - paragraph [ref=f3e146]: "The decoder does the reverse: reconstructs a 28×28 image from a small vector."
            - generic [ref=f3e147]:
              - generic [ref=f3e148]:
                - generic [ref=f3e149]: python
                - button "Copy" [ref=f3e155]
              - generic [ref=f3e159]:
                - code [ref=f3e160]: "class Decoder(nn.Module): def __init__(self, latent_size): super(Decoder, self).__init__() self.fc = nn.Linear(latent_size, 64*7*7) self.bn_fc = nn.BatchNorm1d(64*7*7) self.deconv1 = nn.ConvTranspose2d(64, 32, kernel_size=3, stride=2, padding=1, output_padding=1) self.bn3 = nn.BatchNorm2d(32) self.deconv2 = nn.ConvTranspose2d(32, 1, kernel_size=3, stride=2, padding=1, output_padding=1) def forward(self, z): x = F.leaky_relu(self.bn_fc(self.fc(z))) # z → 3136 dims x = x.view(-1, 64, 7, 7) # Reshape to feature map x = F.leaky_relu(self.bn3(self.deconv1(x))) # 7×7 → 14×14 x = torch.sigmoid(self.deconv2(x)) # 14×14 → 28×28 return x"
                - button "Copy" [ref=f3e161]
            - paragraph [ref=f3e162]: "Fully connected layer expands the d_{\\text{latent}} -dimensional vector into a 64×7×7 feature mapTwo transposed convolution layers progressively upsample: 7×7 → 14×14 → 28×28Finally, Sigmoid activation compresses pixel values to [0, 1]"
            - generic [ref=f3e163]:
              - paragraph [ref=f3e164]: "Line-by-line breakdown:"
              - list [ref=f3e165]:
                - listitem [ref=f3e166]:
                  - code [ref=f3e167]: Linear(latent_size, 64*7*7)
                  - text: — Expands the 4D latent vector into 3136 dimensions
                - listitem [ref=f3e168]:
                  - code [ref=f3e169]: ConvTranspose2d
                  - text: — Transposed convolution (aka deconvolution), upsamples image size
                - listitem [ref=f3e170]:
                  - code [ref=f3e171]: output_padding=1
                  - text: — Ensures exact size doubling (7→14→28)
                - listitem [ref=f3e172]:
                  - code [ref=f3e173]: Sigmoid
                  - text: — Compresses output to [0,1], corresponding to pixel grayscale values
            - heading "VAE Assembly" [level=3] [ref=f3e174]
            - paragraph [ref=f3e175]: "Combine encoder and decoder, with reparameterization in between:"
            - generic [ref=f3e176]:
              - generic [ref=f3e177]:
                - generic [ref=f3e178]: python
                - button "Copy" [ref=f3e184]
              - generic [ref=f3e188]:
                - code [ref=f3e189]: "class VAE(nn.Module): def __init__(self, latent_size): super(VAE, self).__init__() self.encoder = Encoder(latent_size) self.decoder = Decoder(latent_size) def reparameterize(self, mu, logvar): std = torch.exp(0.5 * logvar) # σ = exp(0.5 × log(σ²)) eps = torch.randn_like(std) # ε ~ N(0,1) return mu + eps * std # z = μ + ε × σ def forward(self, x): mu, logvar = self.encoder(x) # Encode z = self.reparameterize(mu, logvar) # Reparameterize & sample return self.decoder(z), mu, logvar # Decode"
                - button "Copy" [ref=f3e190]
            - generic [ref=f3e191]:
              - paragraph [ref=f3e192]: How VAE Works as a Whole
              - paragraph [ref=f3e193]: "The Decoder process is specifically determined by z. The Decoder is a deterministic function: input z, output image, no randomness. The same z always produces the same image. Randomness only exists when sampling z, not inside the Decoder."
              - paragraph [ref=f3e194]: Upscaling and downscaling are essentially the same. Encoder downscales with Conv2d(stride=2), Decoder upscales with ConvTranspose2d(stride=2) — inserting 0s between pixels first, then scanning with a 3×3 kernel. Same mathematical framework (convolution), same training method (gradient weight updates), just opposite directions.
              - paragraph [ref=f3e195]: Any z values within a suitable range can generate accurate images. Any z within the distribution region [-2, 2] compressed by KL divergence can. But manually constructing z=[100, 200, -300, 50] produces noise, because this z was never seen during training.
              - paragraph [ref=f3e196]: "How to determine that learning is effective? Not by comparing later — during training there are three pieces of evidence: loss decreases (from 50+ to 30), reconstructed images look more like the original (epoch 0 is noise, epoch 90 is nearly identical), generated images become clearer (epoch 0 is a gray blob, epoch 90 is a clear digit)."
            - heading "Reparameterization Trick" [level=2] [ref=f3e197]
            - paragraph [ref=f3e198]: "This is the most clever design in VAE. The problem: the encoder outputs a distribution (μ and σ), and we need to \"sample\" z from this distribution. But sampling is non-differentiable — we can't backpropagate through it."
            - paragraph [ref=f3e199]: "Solution: shift the randomness to an external noise ε:"
            - paragraph [ref=f3e200]: "Reparameterization formula:"
            - generic [ref=f3e201]: "z = \\mu + \\epsilon \\cdot \\sigma, \\quad \\epsilon \\sim \\mathcal{N}(0, 1)"
            - paragraph [ref=f3e202]: where ε is sampled from standard normal N(0,1). Now z is still random, but is a deterministic function of μ and σ, enabling normal backpropagation.
            - paragraph [ref=f3e203]: Reparameterization Code：
            - generic [ref=f3e204]:
              - generic [ref=f3e205]:
                - generic [ref=f3e206]: python
                - button "Copy" [ref=f3e212]
              - generic [ref=f3e216]:
                - code [ref=f3e217]: "def reparameterize(self, mu, logvar): std = torch.exp(0.5 * logvar) # Compute σ from log(σ²) eps = torch.randn_like(std) # Sample ε from standard normal return mu + eps * std # Reparameterize"
                - button "Copy" [ref=f3e218]
            - generic [ref=f3e219]:
              - paragraph [ref=f3e220]: Why Reparameterization is Needed
              - paragraph [ref=f3e221]: Sampling is non-differentiable. If we directly sample z from N(μ, σ²), the gradient of z with respect to μ and σ is 0 — backpropagation can't pass through, weights can't be updated.
              - paragraph [ref=f3e222]: "Reparameterization splits the sampling into two steps: first sample ε from standard normal (this operation doesn't need gradients), then compute z = μ + ε×σ (this operation is deterministic, can compute gradients). Now the gradient of z with respect to μ is 1, with respect to σ is ε — gradients can flow back normally."
              - paragraph [ref=f3e223]: "Intuitive understanding: imagine tuning a radio. μ is the center frequency, σ is the bandwidth. Reparameterization is like first fixing a random noise ε, then when you adjust μ and σ, the output z changes accordingly. This way you can control the distribution of z by adjusting μ and σ."
            - heading "Loss Function" [level=2] [ref=f3e224]
            - figure "▲ Training loss curve (MSE + KL) over epochs" [ref=f3e225]:
              - img "VAE training loss curve" [ref=f3e226]
            - paragraph [ref=f3e228]: "VAE's loss function consists of two parts:"
            - generic [ref=f3e229]:
              - paragraph [ref=f3e230]: Mathematical Derivation (Optional)
              - paragraph [ref=f3e231]: "VAE's loss function comes from the lower bound of the log-likelihood function (ELBO). Given data x, we want to maximize log p(x), but direct computation is difficult (requires integrating over all possible z). VAE uses variational inference to construct an optimizable lower bound:"
              - paragraph [ref=f3e232]: log p(x) ≥ E[log p(x|z)] - KL(q(z|x) || p(z))
              - paragraph [ref=f3e233]: The first term E[log p(x|z)] is the reconstruction loss (another form of MSE), measuring the decoder's ability to reconstruct x from z. The second term KL(q(z|x) || p(z)) is the KL divergence, measuring how far the encoder's output distribution q(z|x) is from the prior distribution p(z) (standard normal).
              - paragraph [ref=f3e234]: "Intuitive understanding: we're simultaneously doing two things — making reconstructed images look as much like the original as possible (first term), and making the encoder's output distribution as close to standard normal as possible (second term). They balance each other, eventually reaching equilibrium."
            - heading "Reconstruction Loss (MSE)" [level=3] [ref=f3e235]
            - paragraph [ref=f3e236]: "Measures how different the reconstructed image is from the original. Uses Mean Squared Error (MSE), multiplied by 784 (28×28 total pixels) to match the magnitude of KL divergence:"
            - generic [ref=f3e237]: "\\mathcal{L}_{\\text{recon}} = \\text{MSE}(x, \\hat{x}) \\times 784"
            - generic [ref=f3e238]:
              - generic [ref=f3e239]:
                - generic [ref=f3e240]: python
                - button "Copy" [ref=f3e246]
              - generic [ref=f3e250]:
                - code [ref=f3e251]: recon_loss = F.mse_loss(recon_x, inputs, reduction='mean') * 784
                - button "Copy" [ref=f3e252]
            - paragraph [ref=f3e253]: reduction='mean' computes per-pixel average error, multiplying by 784 restores total image error
            - generic [ref=f3e254]:
              - paragraph [ref=f3e255]: MSE Characteristics
              - paragraph [ref=f3e256]: MSE treats all errors equally — each pixel's difference is penalized proportionally, small errors get small penalties, large errors get large penalties. There is no threshold like 'errors below 0.2 are forgiven'. Squared penalty is inherently a nonlinear amplification — large errors are penalized far more than small ones.
              - paragraph [ref=f3e257]: "Why multiply by 784? Magnitude = the scale of a numerical value. Without multiplying by 784, MSE is about 0.05, KL about 2.0, KL dominates training. After multiplying by 784, MSE is about 39, both at the same magnitude. 784 = 28×28 is the total pixel count; 'per-pixel average' × 784 = 'whole-image sum'. Other values work too, e.g., setting hyperparameter β: loss = β×MSE + KL. But 784 is a well-fitting empirical value."
            - heading "KL Divergence" [level=3] [ref=f3e258]
            - paragraph [ref=f3e259]: "Measures how far the encoder's output distribution is from standard normal N(0,1). Smaller KL divergence means a more regular latent space and better sampling:"
            - generic [ref=f3e260]: "D_{\\text{KL}} = -\\frac{1}{2} \\sum_{i=1}^{d} (1 + \\log(\\sigma_i^2) - \\mu_i^2 - \\sigma_i^2)"
            - generic [ref=f3e261]:
              - generic [ref=f3e262]:
                - generic [ref=f3e263]: python
                - button "Copy" [ref=f3e269]
              - generic [ref=f3e273]:
                - code [ref=f3e274]: kl_loss = -0.5 * torch.mean(1 + logvar - mu.pow(2) - logvar.exp())
                - button "Copy" [ref=f3e275]
            - paragraph [ref=f3e276]: "The derivation involves probability theory. Intuitively: it pushes the encoder's output distribution toward standard normal"
            - generic [ref=f3e277]:
              - paragraph [ref=f3e278]: The Role of KL Divergence
              - paragraph [ref=f3e279]: KL divergence measures the difference between two distributions. In VAE, it measures how far the encoder's output distribution (defined by μ and σ) is from standard normal N(0,1). μ=0, σ=1, KL≈0 (perfect); μ=3, σ=0.1, KL very large (both biased and narrow).
              - paragraph [ref=f3e280]: Why constrain to normal distribution? Because during generation we sample z from standard normal. If during training the encoder's output distribution is not normal, then during generation the sampled z will be in regions never seen during training, the decoder won't know how to handle it, and generation quality will be poor.
              - paragraph [ref=f3e281]: "Balance between KL and MSE: MSE makes reconstructed images look more like originals, KL makes the latent space more regular. They balance each other. If only optimizing MSE, the encoder maps each digit to a different corner of latent space (overfitting); if only optimizing KL, the encoder maps all digits to the origin (losing information)."
            - heading "Total Loss" [level=3] [ref=f3e282]
            - paragraph [ref=f3e283]: "The two parts add up to the total loss:"
            - generic [ref=f3e284]: "\\mathcal{L} = \\mathcal{L}_{\\text{recon}} + D_{\\text{KL}}"
            - paragraph [ref=f3e285]: During training, MSE makes reconstructions look more like originals, KL makes the latent space more regular. They balance each other.
            - heading "Data Processing Details" [level=2] [ref=f3e286]
            - paragraph [ref=f3e287]: "Before training, data needs preprocessing. Here are several key questions:"
            - heading "Normalization" [level=3] [ref=f3e288]
            - paragraph [ref=f3e289]: "Original pixel range might be [0.1, 0.9], min=0.1, max=0.9, normalization formula: (images - min) / (max - min + 1e-8), transforms each pixel to [0, 1]. A pixel value 0.5 becomes (0.5 - 0.1) / 0.8 = 0.5, preserving relative relationships. +1e-8 prevents division by zero."
            - paragraph [ref=f3e290]: Why normalize? save_image assumes input is in [0, 1] and maps directly to [0, 255]. Input -0.5 clips to 0, pure black; input 2.0 clips to 1, pure white. Normalization stretches all values back to [0, 1].
            - heading "Input Size" [level=3] [ref=f3e291]
            - paragraph [ref=f3e292]: If the input image is not 28×28 pixels, can the model still work? If you just change the image to 64×64 or color without changing code — it won't run. The entire network's dimensions are hardcoded. fc_mu = nn.Linear(64*7*7, latent_size) locks the input to 3136. Switching to 64×64 gives 64×16×16 = 16384, mismatching 3136, causing an error.
            - paragraph [ref=f3e293]: "Where does 28 come from? It's not hardcoded. There's no line in model.py that writes 28. 28 is derived from the data structure itself. How is 64×7×7 derived? Conv2d stride=2 twice: input H, H/2, H/4. H/4 = 7, so H = 28. The model doesn't check if it's 28 or 64 — the fc layer hardcodes 3136, feeding a 32×32 image will cause an error."
            - heading "Training Process" [level=2] [ref=f3e294]
            - 'figure "▲ Reconstruction: top row = original MNIST images, bottom row = VAE reconstructions" [ref=f3e295]':
              - 'img "VAE reconstruction: top row original, bottom row reconstructed" [ref=f3e296]'
            - paragraph [ref=f3e298]: "The training code is very concise. The core loop is: forward pass → compute loss → backward pass → update weights:"
            - generic [ref=f3e299]:
              - generic [ref=f3e300]:
                - generic [ref=f3e301]: python
                - button "Copy" [ref=f3e307]
              - generic [ref=f3e311]:
                - code [ref=f3e312]: "for epoch in range(num_epochs): vae.train() for data in dataloader: inputs, _ = data inputs = inputs.to(device) optimizer.zero_grad() # Forward pass recon_x, mu, logvar = vae(inputs) # Compute loss recon_loss = F.mse_loss(recon_x, inputs, reduction='mean') * 784 kl_loss = -0.5 * torch.mean(1 + logvar - mu.pow(2) - logvar.exp()) loss = recon_loss + kl_loss # Backward pass + update weights loss.backward() optimizer.step()"
                - button "Copy" [ref=f3e313]
            - paragraph [ref=f3e314]:
              - strong [ref=f3e315]: "Key hyperparameters:"
              - text: batch_size = 256, learning_rate = 0.001, latent_size = 4 (4D latent space), num_epochs = 100
            - generic [ref=f3e316]:
              - paragraph [ref=f3e317]: "Deep Dive: Training Mechanism"
              - paragraph [ref=f3e318]: "Do Encoder and Decoder learn simultaneously? Yes. Feedback adjustment is backpropagation, in three steps: Step 1 forward pass (run once); Step 2 backpropagation (trace back along the computation graph — MSE tells Decoder its output pixels are off by 0.4, KL tells Encoder its distribution width is unreasonable); Step 3 weight update (each weight = original value - learning rate × gradient)."
              - paragraph [ref=f3e319]: Gradients are globally connected. Starting from the loss, tracing back along the computation graph. Every weight reached is assigned a share of 'responsibility' (gradient). conv1's 5th kernel receives gradients from both MSE and KL, combined, then fine-tuned in the direction of the combined force. There is no 'local optimization' — one chain from start to finish.
              - paragraph [ref=f3e320]: "Training is completely autonomous. You only need to do three things: write the model structure (already done), feed data (MNIST dataset), run python train.py. After that, the process is fully automatic: a batch of images in, forward pass, compute loss, backpropagation, update weights, next batch in, repeat this cycle. You don't need to manually adjust weights or tell the model 'this is digit 3'."
              - paragraph [ref=f3e321]: "Weight storage: during training, stored in GPU memory. All kernels, fc weight matrices, bn parameters are loaded into GPU VRAM. During forward pass, weights and intermediate data are in VRAM; after backward, intermediate results are released but updated weights remain. Periodically, torch.save packages VRAM weights into a .pth file. Without saving, closing the process clears VRAM and all weights are lost."
            - heading "Training Results" [level=2] [ref=f3e322]
            - paragraph [ref=f3e323]: "After 100 epochs, the model demonstrates three capabilities:"
            - list [ref=f3e324]:
              - listitem [ref=f3e325]:
                - strong [ref=f3e326]: Reconstruct images
                - text: ": Input a handwritten digit, output an almost identical image"
              - listitem [ref=f3e327]:
                - strong [ref=f3e328]: Generate images
                - text: ": Sample z from standard normal, decode to generate brand new digit images"
              - listitem [ref=f3e329]:
                - strong [ref=f3e330]: Latent space interpolation
                - text: ": Linearly interpolate between two digits' z to generate smooth transitions"
            - paragraph [ref=f3e331]: The reconstruction comparison demonstrates VAE's core capability. Top row shows original MNIST handwritten digits, bottom row shows VAE reconstructions. The reconstructed digits closely match the originals — stroke thickness, tilt angle, and overall shape are highly preserved. Occasional blurriness is expected with only 4 latent dimensions, as information compression is lossy, but overall quality is good.
            - paragraph [ref=f3e332]: The latent space is only 4-dimensional, but it's enough for the model to distinguish different digits. Each dimension controls some feature (like stroke thickness, tilt angle, etc.). By interpolating in latent space, we can see smooth transitions between digits — for example, morphing from 3 to 8, with intermediate shapes looking like a blend of both.
            - heading "VAE Limitations & Improvements" [level=2] [ref=f3e333]
            - paragraph [ref=f3e334]: "While VAE is a powerful generative model, it has some limitations:"
            - generic [ref=f3e335]:
              - button "Blurry Generated Images" [ref=f3e336]
              - generic [ref=f3e342]:
                - paragraph [ref=f3e343]: This is the most obvious problem with VAE. The reason is the nature of MSE loss — when the model is uncertain whether a pixel should be 0 or 1, it will output 0.5 (average) to reduce MSE. This causes generated images to look 'hazy'.
                - paragraph [ref=f3e344]: "Improvements: use Perceptual Loss instead of MSE, comparing high-level features rather than pixel values; use GAN discriminator to judge whether generated images are 'realistic'; use more complex posterior distributions (like Normalizing Flow)."
            - generic [ref=f3e345]:
              - button "Posterior Collapse" [ref=f3e346]
              - generic [ref=f3e350]:
                - paragraph [ref=f3e351]: Sometimes after training, KL divergence drops to 0, the encoder maps all inputs to standard normal distribution, the decoder ignores z and generates images from noise alone. This happens because the decoder is too powerful and doesn't need z to generate reasonable images.
                - paragraph [ref=f3e352]: "Improvements: use KL annealing strategy (KL weight gradually increases from 0 to 1 during early training); use Free Bits strategy (set a minimum value for KL divergence); use a weaker decoder (like reducing layers)."
            - generic [ref=f3e353]:
              - button "Latent Space Interpolation Quality" [ref=f3e354]
              - generic [ref=f3e358]:
                - paragraph [ref=f3e359]: VAE's latent space interpolation sometimes isn't smooth enough — transitions between two digits may look unnatural. This is because KL divergence only constrains the marginal distribution to be normal, not the joint distribution.
                - paragraph [ref=f3e360]: "Improvements: use β-VAE (β > 1 to strengthen KL constraint); use WAE (Wasserstein Autoencoder) with other distance metrics; use VQ-VAE (Vector Quantized VAE) with discrete latent space."
            - heading "Model Evaluation & Tuning" [level=2] [ref=f3e361]
            - paragraph [ref=f3e362]: "How to evaluate VAE's performance? Here are several key metrics:"
            - heading "Reconstruction Quality" [level=3] [ref=f3e363]
            - paragraph [ref=f3e364]: The most intuitive evaluation is to check how similar reconstructed images are to originals. Can be quantified with MSE, SSIM (Structural Similarity), etc. Smaller MSE means reconstruction looks more like the original. But MSE isn't the only standard — sometimes MSE is very low but images look blurry, because the model learned to 'average' to reduce error.
            - heading "Generation Quality" [level=3] [ref=f3e365]
            - paragraph [ref=f3e366]: "Generation quality assessment is somewhat subjective. Common method: let humans judge whether generated images look like real digits. Can also use automated metrics like FID (Fréchet Inception Distance), but these require pretrained classification models, not very suitable for simple datasets."
            - heading "Latent Space Quality" [level=3] [ref=f3e367]
            - paragraph [ref=f3e368]: "A good latent space should satisfy: continuity (similar z generates similar images), completeness (randomly sampled z all generate reasonable images), interpretability (each dimension controls some semantic feature). Can be intuitively evaluated by interpolating in latent space."
            - heading "Tuning Tips" [level=3] [ref=f3e369]
            - paragraph [ref=f3e370]: "If generated images are very blurry: increase latent space dimensions (latent_size from 4 to 8 or 16); use more complex network structure (deeper convolutional layers); try different loss functions (like L1 loss instead of MSE)."
            - paragraph [ref=f3e371]: "If KL divergence drops to 0: the encoder maps all inputs to standard normal distribution, losing distinguishing information. Can reduce KL weight (like loss = recon_loss + 0.5 * kl_loss), or use KL annealing strategy (KL weight gradually increases from 0 to 1 during early training)."
            - paragraph [ref=f3e372]: "If training is unstable: reduce learning rate (from 0.001 to 0.0001); increase batch_size (from 256 to 512); use gradient clipping (torch.nn.utils.clip_grad_norm_)."
            - heading "Summary & Review" [level=2] [ref=f3e373]
            - paragraph [ref=f3e374]: "Through this article, we understood the core principles of VAE from scratch. Let's review the entire learning process:"
            - heading "What We Learned" [level=3] [ref=f3e375]
            - paragraph [ref=f3e376]: VAE is a generative model whose core idea is 'compress and reconstruct'. The encoder compresses an image into a small vector (a point in latent space), and the decoder reconstructs the image from this vector. Through training, the model learns the essential features of data, and can randomly sample from the latent space to generate brand new images.
            - heading "Three Key Designs" [level=3] [ref=f3e377]
            - list [ref=f3e378]:
              - listitem [ref=f3e379]:
                - strong [ref=f3e380]: Reparameterization trick
                - text: ": Turns non-differentiable sampling into a differentiable computation graph, enabling normal gradient backpropagation"
              - listitem [ref=f3e381]:
                - strong [ref=f3e382]: KL divergence constraint
                - text: ": Makes the encoder's output distribution approach standard normal, making generation-time sampling effective"
              - listitem [ref=f3e383]:
                - strong [ref=f3e384]: MSE reconstruction loss
                - text: ": Makes reconstructed images look as much like originals as possible, forcing the model to learn essential data features"
            - heading "Why This Design" [level=3] [ref=f3e385]
            - paragraph [ref=f3e386]: "These three designs work together: reparameterization makes training possible, KL divergence makes generation possible, MSE ensures reconstruction quality. All three are indispensable, together forming VAE's complete training framework."
            - heading "Next Learning Steps" [level=3] [ref=f3e387]
            - paragraph [ref=f3e388]: "After understanding basic VAE, you can continue exploring: color image generation (extending to 3 channels), CVAE (conditional generation, specifying which digit to generate), β-VAE (enhanced latent space disentanglement), VQ-VAE (discrete latent space, used for text generation)."
